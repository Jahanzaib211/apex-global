<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>This page has moved · Apex Global Tech Solution</title>
    <meta
      name="description"
      content="The page you're looking for has moved or no longer exists. From the home page, everything Apex Global Tech Solution publishes is reachable through the navigation."
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b1d3a;
        color: #f8fafc;
        font-family: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 4rem 1.5rem;
      }
      section {
        max-width: 36rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(7rem, 22vw, 16rem);
        line-height: 0.95;
        margin: 0 0 1.5rem;
        color: #c89b3c;
        letter-spacing: -0.02em;
      }
      h2 {
        margin: 0 0 1rem;
        font-size: clamp(1.25rem, 3vw, 1.875rem);
        font-weight: 600;
      }
      p {
        margin: 0 0 2rem;
        color: rgba(248, 250, 252, 0.7);
        line-height: 1.65;
        font-size: 1rem;
      }
      a.button {
        display: inline-block;
        background: #c89b3c;
        color: #0b1d3a;
        padding: 0.875rem 1.5rem;
        margin-bottom: 0.75rem;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        border-radius: 0.375rem;
        transition: background 150ms ease;
      }
      a.button:hover {
        background: #f8fafc;
      }
      a.secondary {
        display: block;
        color: rgba(248, 250, 252, 0.85);
        text-decoration: underline;
        text-underline-offset: 4px;
        font-size: 0.95rem;
      }
      a.secondary:hover {
        color: #c89b3c;
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>404</h1>
        <h2>This page has moved.</h2>
        <p>
          The link may be out of date, or the page may no longer exist. From the home page, everything Apex publishes is reachable through the navigation.
        </p>
        <div class="actions">
          <a class="button" href="/">Back to home</a>
          <a class="secondary" href="/contact">Contact us instead →</a>
        </div>
      </section>
    </main>
  </body>
